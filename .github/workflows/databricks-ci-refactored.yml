name: Databricks Refactored CI

on:
  pull_request:
    branches:
      - develop
      - release
      - main

permissions:
  contents: read

jobs:
  validate-promotion:
    runs-on: ubuntu-latest

    steps:
      - name: Validate promotion path and resolve stage
        run: |
          SOURCE_BRANCH="${{ github.head_ref }}"
          TARGET_BRANCH="${{ github.base_ref }}"

          echo "Source branch: $SOURCE_BRANCH"
          echo "Target branch: $TARGET_BRANCH"

          case "$TARGET_BRANCH" in
            develop)
              if [[ "$SOURCE_BRANCH" != feature/* ]]; then
                echo "Invalid promotion path: $SOURCE_BRANCH -> $TARGET_BRANCH"
                echo "Only feature/* branches can merge into develop."
                exit 1
              fi
              echo "DEPLOYMENT_STAGE=DEV" >> "$GITHUB_ENV"
              ;;

            release)
              if [[ "$SOURCE_BRANCH" != "develop" ]]; then
                echo "Invalid promotion path: $SOURCE_BRANCH -> $TARGET_BRANCH"
                echo "Only develop can merge into release."
                exit 1
              fi
              echo "DEPLOYMENT_STAGE=TEST" >> "$GITHUB_ENV"
              ;;

            main)
              if [[ "$SOURCE_BRANCH" != "release" ]]; then
                echo "Invalid promotion path: $SOURCE_BRANCH -> $TARGET_BRANCH"
                echo "Only release can merge into main."
                exit 1
              fi
              echo "DEPLOYMENT_STAGE=PROD" >> "$GITHUB_ENV"
              ;;

            *)
              echo "Unsupported target branch: $TARGET_BRANCH"
              exit 1
              ;;
          esac

      - name: Show CI context
        run: |
          echo "Source branch: ${{ github.head_ref }}"
          echo "Target branch: ${{ github.base_ref }}"
          echo "Logical stage: $DEPLOYMENT_STAGE"

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify Databricks project files
        run: |
          pwd
          ls -la
          test -f databricks.yml

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Verify Databricks CLI
        run: databricks version

      - name: Confirm CI validation
        run: |
          echo "$DEPLOYMENT_STAGE CI validation completed successfully."
