name: Databricks Dev CI

on:
  workflow_dispatch:
  
#on:
#  pull_request:
#    branches:
#      - develop

jobs:
  validate-workflow:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
    
      - name: Verify Databricks project files
        run: |
          pwd
          ls -la
          test -f databricks.yml
      
      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Verify Databricks CLI
        run: databricks version
          
    
      - name: Confirm GitHub Actions runner
        run: echo "GitHub Actions workflow is running for a PR to develop."
