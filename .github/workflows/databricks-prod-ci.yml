name: Databricks Prod CI

on:
  pull_request:
    branches:
      - main

jobs:
  validate-prod-promotion:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify Databricks project files
        run: |
          pwd
          ls -la
          test -f databricks.yml

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Verify Databricks CLI
        run: databricks version

      - name: Confirm PROD promotion CI
        run: echo "CI checks passed for a PR targeting main."
