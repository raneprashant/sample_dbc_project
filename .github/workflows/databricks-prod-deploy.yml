name: Databricks Prod Deployment

on:
  workflow_dispatch:
  
#on:
#  push:
#    branches:
#      - main

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    environment: prod

    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Verify Databricks authentication
        run: |
          databricks current-user me > /dev/null
          echo "Databricks authentication succeeded."

      - name: Validate Databricks PROD bundle
        run: |
          databricks bundle validate --target prod > /dev/null
          echo "Databricks PROD bundle validation succeeded."

      - name: Plan Databricks PROD deployment
        run: databricks bundle plan --target prod

      - name: Deploy Databricks PROD bundle
        run: databricks bundle deploy --target prod

      - name: Run Databricks PROD job
        run: databricks bundle run --target prod sample_job
