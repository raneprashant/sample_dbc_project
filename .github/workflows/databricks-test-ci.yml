name: Databricks Test CI

on:
  workflow_dispatch:
  
#on:
#  pull_request:
#    branches:
#      - release

jobs:
  validate-test-promotion:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify Databricks project files
        run: |
          pwd
          ls -la
          test -f databricks.yml

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Verify Databricks CLI
        run: databricks version

      - name: Confirm TEST promotion CI
        run: echo "CI checks passed for a PR targeting release."
